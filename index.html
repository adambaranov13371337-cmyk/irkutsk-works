<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#232323">
  <title>Работы · Портфолио</title>
  <link rel="stylesheet" href="style.css?v=telegram-contact">
  <script defer src="projects.js?v=live14"></script>
  <script defer src="field.js?v=pins2"></script>
  <script defer src="viewer.js?v=live-preview"></script>
</head>
<body>
  <header>
    <nav aria-label="Разделы"><a href="#works" id="works-tab" aria-current="page">Работы</a></nav>
    <a class="telegram-contact" href="https://t.me/negative0000" target="_blank" rel="noopener" aria-label="Написать Богдану в Telegram, @negative0000" title="Telegram · @negative0000">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.8 3.6a1.2 1.2 0 0 0-1.4-.2L2.7 10.2c-1.1.4-1.1 1.1-.2 1.4l4.6 1.5 10.6-6.7c.5-.3.8-.1.4.3l-8.6 7.8 6.7 5c.8.6 1.5.3 1.7-.7l4-13.9c.1-.6.1-1-.1-1.3Z"/>
      </svg>
    </a>
  </header>
  <main>
    <aside class="sidebar">
      <section id="catalog"><h1>Работы</h1><div id="projects"></div></section>
    </aside>
    <section id="desk" aria-label="Область просмотра работ">
      <canvas id="field" tabindex="0" role="group" aria-label="Интерактивная сетка. Потяните край, чтобы закрепить его. Середина пружинит. С клавиатуры используйте стрелки и пробел."></canvas>
      <div id="field-touch" aria-hidden="true"></div>
      <button id="reset-field" type="button" aria-label="Выровнять сетку" title="Выровнять сетку">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10a7.8 7.8 0 1 1 .8 6M4.5 4.8V10h5.2"/></svg>
      </button>
      <section id="window" role="dialog" aria-labelledby="title" hidden>
        <div id="bar">
          <div id="handle" tabindex="0" title="Перетащить окно. Клавиши со стрелками перемещают его." aria-label="Переместить окно"><i class="folder" aria-hidden="true"></i><h2 id="title"></h2></div>
          <button id="close" aria-label="Закрыть окно">×</button>
        </div>
        <div id="preview"></div>
        <footer>
          <a id="original" target="_blank" rel="noopener">Оригинал</a>
          <a id="visit" target="_blank" rel="noopener">Открыть демо</a>
        </footer>
      </section>
    </section>
  </main>
</body>
</html>
